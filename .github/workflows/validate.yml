name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        # crack-emu 린트가 pyyaml 을 import 한다. 없으면 validate.sh 의 키워드북 검사가
        # ModuleNotFoundError 로 죽고 "실패 있음" 으로 끝난다(v0.10.33 부터 CI 가 계속 붉었던 원인).
        run: pip install pyyaml

      - name: 검증 스크립트 문법 확인
        run: python -m compileall -q skills/design-crack-story-chat/scripts tools/images

      - name: 예제 프로젝트 검증
        run: ./scripts/validate.sh examples/hunter

      - name: 음성 대조 — 미정의 기호가 실제로 잡히는지
        run: |
          S=skills/design-crack-story-chat/scripts
          sed 's/^# 세션 목표/# 세션 목표\nⓝ ⇒ 🦊/' \
            examples/hunter/build/integrated-prompt-safe.md > /tmp/negative.md
          if python3 $S/check_symbols.py /tmp/negative.md; then
            echo "검사기가 미정의 기호를 놓쳤다"; exit 1
          fi
          echo "음성 대조 통과"

      - name: 이미지 배포 검사기 — 오타 슬러그를 잡는지
        # deploy.py 는 v0.9.5 부터 EXT(.webp) 파일만 센다. 예전 픽스처는 scene 만 .png 로 만들어
        # 양성 검사부터 "올릴 이미지가 없습니다" 로 실패했다. 기대 경로를 deploy.expected() 에서
        # 그대로 받아 만들고, 음성 대조는 파일 하나만 오타 이름으로 복사한다.
        run: |
          cd tools/images
          export CRACK_PROMPTS=$PWD/../../examples/hunter/build/assets/prompts.json
          python - <<'EOF'
          import json, os, pathlib
          import deploy
          cfg = json.load(open(os.environ["CRACK_PROMPTS"], encoding="utf-8"))
          root = pathlib.Path("out")
          for rel in set().union(*deploy.expected(cfg).values()):
              f = root / rel
              f.parent.mkdir(parents=True, exist_ok=True)
              f.write_bytes(b"RIFF\x00\x00\x00\x00WEBPVP8 ")
          EOF
          python deploy.py --check --root out
          first=$(ls out/scene/*.webp | head -1)
          cp "$first" out/scene/definitely-not-a-slug.webp
          if python deploy.py --check --root out; then echo "검사기가 오타 슬러그를 놓쳤다"; exit 1; fi
          echo "배포 검사기 음성 대조 통과"

      - name: 신선도 검사 — 원본을 고치면 잡는지
        run: |
          S=skills/design-crack-story-chat/scripts
          printf '\n<!-- ci probe -->\n' >> examples/hunter/characters.md
          if python3 $S/check_freshness.py examples/hunter; then
            echo "원본 변경을 놓쳤다"; exit 1
          fi
          git checkout examples/hunter/characters.md
          echo "신선도 음성 대조 통과"

      - name: .skill 패키지 빌드
        run: ./scripts/build-skill.sh
