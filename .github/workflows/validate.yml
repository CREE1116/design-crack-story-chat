name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 검증 스크립트 문법 확인
        run: python -m compileall -q skills/design-crack-story-chat/scripts tools/imagegen

      - name: 예제 프로젝트 검증
        run: ./scripts/validate.sh examples/hunter

      - name: 음성 대조 — 미정의 기호가 실제로 잡히는지
        run: |
          S=skills/design-crack-story-chat/scripts
          sed 's/^# 세션 목표/# 세션 목표\nⓝ ⇒ 🦊/' \
            examples/hunter/build/integrated-prompt-safe.md > /tmp/negative.md
          if python3 $S/check_symbols.py /tmp/negative.md; then
            echo "검사기가 미정의 기호를 놓쳤다"; exit 1
          fi
          echo "음성 대조 통과"

      - name: 이미지 도구 — 목 서버로 왕복 확인
        run: |
          cd tools/imagegen
          python mock_a1111.py & sleep 2
          python batch.py --check
          python batch.py --dry-run --only ju-habin --situations normal \
            --no-scenes --no-monsters --no-backgrounds

      - name: 이미지 배포 검사기 — 오타 슬러그를 잡는지
        run: |
          cd tools/imagegen
          python - <<'EOF'
          import json, pathlib, struct, zlib
          cfg = json.load(open("prompts.json", encoding="utf-8"))
          def png():
              raw = b"".join(b"\x00" + bytes((120,120,120))*8 for _ in range(8))
              ch = lambda t,d: struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xFFFFFFFF)
              return (b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack(">IIBBBBB",8,8,8,2,0,0,0))
                      +ch(b"IDAT",zlib.compress(raw,6))+ch(b"IEND",b""))
          root = pathlib.Path("out")
          for name in cfg["scenes"]:
              f = root/"scene"/f"{name}.png"; f.parent.mkdir(parents=True, exist_ok=True)
              f.write_bytes(png())
          EOF
          python deploy.py --check
          cp out/scene/*.png out/scene/definitely-not-a-slug.png
          if python deploy.py --check; then echo "검사기가 오타 슬러그를 놓쳤다"; exit 1; fi
          echo "배포 검사기 음성 대조 통과"

      - name: .skill 패키지 빌드
        run: ./scripts/build-skill.sh
