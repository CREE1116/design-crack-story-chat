[project]
name = "crack-emulator"
version = "0.1.0"
description = "Crack story-chat emulator and QA harness"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
crack-emu = "crack_emulator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crack_emulator"]
